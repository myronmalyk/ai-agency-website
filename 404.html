<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Page not found — Tyvelo</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&family=Space+Mono:wght@400&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&family=Space+Mono:wght@400&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400&family=Space+Mono:wght@400&display=swap" /></noscript>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #131313;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8e8;
      --text-dim: rgba(232, 232, 232, 0.45);
      --accent: #8B9DFF;
      --font-serif: 'DM Serif Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ─────────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 40px);
      max-width: 900px;
    }

    .nav__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .nav__logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 10px;
    }

    .nav__logo img {
      height: 28px;
      mix-blend-mode: screen;
    }

    .nav__back {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .nav__back:hover { color: var(--accent); }

    /* ── CONTENT ─────────────────────────────────────────────── */
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 140px 24px 80px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .page-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: block;
    }

    .page-title {
      font-family: var(--font-serif);
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
    }

    .page-body {
      font-size: 15px;
      color: var(--text-dim);
      line-height: 1.75;
      margin-bottom: 36px;
      max-width: 48ch;
    }

    .btn {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .btn--outline {
      border: 1px solid rgba(139, 157, 255, 0.4);
      color: var(--accent);
      background: transparent;
    }

    .btn--outline:hover {
      background: var(--accent);
      color: #0a0a0a;
      border-color: var(--accent);
    }

    /* ── FOOTER ──────────────────────────────────────────────── */
    .footer {
      padding: 32px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .footer p {
      font-size: 13px;
      color: var(--text-dim);
    }

    .footer a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }

    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <!-- ── NAV ─────────────────────────────────────────── -->
  <nav class="nav" role="navigation">
    <div class="nav__inner">
      <a href="/" class="nav__logo" aria-label="Tyvelo home">
        <picture><source srcset="images/logo/logo_text_black.webp" type="image/webp"><img src="images/logo/logo_text_black.png" alt="Tyvelo" loading="lazy" /></picture>
      </a>
      <a href="/" class="nav__back">← Back to home</a>
    </div>
  </nav>

  <!-- ── CONTENT ──────────────────────────────────────── -->
  <main class="page" id="main">
    <span class="page-label">// 404</span>
    <h1 class="page-title">Page not found.</h1>
    <p class="page-body">The link may be broken or the page may have moved.</p>
    <a href="/" class="btn btn--outline">Go to homepage →</a>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Tyvelo. All rights reserved.</p>
    <a href="/">← Back to tyvelo.com</a>
  </footer>

</body>
</html>
